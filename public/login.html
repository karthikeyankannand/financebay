<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FinanceBay - Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="auth-container">
      <div class="logo">
        <h1>💰 FinanceBay</h1>
        <p>Track Your Expenses Smartly</p>
      </div>

      <div class="theme-selector">
        <button onclick="setTheme('light')" class="theme-btn" title="Light Theme">☀️</button>
        <button onclick="setTheme('dark')" class="theme-btn" title="Dark Theme">🌙</button>
        <button onclick="setTheme('grey')" class="theme-btn" title="Grey Theme">⚫</button>
      </div>

      <div id="loginForm" class="auth-form">
        <h2>Login</h2>
        <form onsubmit="handleLogin(event)">
          <div class="form-group">
            <label for="loginUsername">Username</label>
            <input type="text" id="loginUsername" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" required>
          </div>
          <button type="submit" class="btn btn-primary">Login</button>
        </form>
        <p class="toggle-form">
          Don't have an account? <a href="#" onclick="toggleForm(); return false;">Sign Up</a>
        </p>
      </div>

      <div id="signupForm" class="auth-form" style="display: none;">
        <h2>Sign Up</h2>
        <form onsubmit="handleSignup(event)">
          <div class="form-group">
            <label for="signupUsername">Username</label>
            <input type="text" id="signupUsername" required>
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input type="email" id="signupEmail" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" required minlength="6">
          </div>
          <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
        <p class="toggle-form">
          Already have an account? <a href="#" onclick="toggleForm(); return false;">Login</a>
        </p>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function toggleForm() {
      const loginForm = document.getElementById('loginForm');
      const signupForm = document.getElementById('signupForm');
      const message = document.getElementById('message');
      
      if (loginForm.style.display === 'none') {
        loginForm.style.display = 'block';
        signupForm.style.display = 'none';
      } else {
        loginForm.style.display = 'none';
        signupForm.style.display = 'block';
      }
      message.textContent = '';
      message.className = 'message';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const message = document.getElementById('message');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();
        
        if (data.success) {
          message.textContent = 'Login successful! Redirecting...';
          message.className = 'message success';
          setTimeout(() => {
            if (data.isAdmin) {
              window.location.href = 'admin.html';
            } else {
              window.location.href = 'daily-expense.html';
            }
          }, 1000);
        } else {
          message.textContent = data.message;
          message.className = 'message error';
        }
      } catch (error) {
        message.textContent = 'Login failed. Please try again.';
        message.className = 'message error';
      }
    }

    async function handleSignup(event) {
      event.preventDefault();
      const username = document.getElementById('signupUsername').value;
      const email = document.getElementById('signupEmail').value;
      const password = document.getElementById('signupPassword').value;
      const message = document.getElementById('message');

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });

        const data = await response.json();
        
        if (data.success) {
          message.textContent = 'Registration successful! Please login.';
          message.className = 'message success';
          setTimeout(() => {
            toggleForm();
          }, 1500);
        } else {
          message.textContent = data.message;
          message.className = 'message error';
        }
      } catch (error) {
        message.textContent = 'Registration failed. Please try again.';
        message.className = 'message error';
      }
    }

    // Check if already logged in
    checkSession().then(data => {
      if (data.authenticated) {
        if (data.isAdmin) {
          window.location.href = 'admin.html';
        } else {
          window.location.href = 'daily-expense.html';
        }
      }
    });
  </script>
</body>
</html>
